<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #mundo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }

      /* Subtítulos de todo lo que dice la voz: pequeños, abajo en el centro, blanco con borde negro.
         Van en la franja de 1318–1394 px, la misma altura que en los shorts de referencia
         y por encima de los 420 px de abajo que tapan los botones. */
      .sub { position: absolute; left: 0; width: 1080px; top: 1318px; height: 76px;
             display: flex; align-items: center; justify-content: center; text-align: center; z-index: 20; }
      .sub span { font: 700 46px/1.1 "Montserrat", sans-serif; color: #fff; max-width: 900px;
                  -webkit-text-stroke: 9px #000; paint-order: stroke fill; }

      /* Palabras clave: grandes, de vez en cuando, por la pantalla. La clave en amarillo. */
      .clave { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; z-index: 30; }
      .clave .clave-in { display: inline-block; font: 900 112px/1.02 "Archivo Black", "Montserrat", sans-serif;
                         color: #fff; text-transform: uppercase; text-align: center; max-width: 820px;
                         -webkit-text-stroke: 18px #241726; paint-order: stroke fill; }
      .clave em { font-style: normal; color: #ffd23f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas id="mundo" width="1080" height="1920"></canvas>

      <!-- VOZ: descomenta y pon su duración en segundos (la del root es esta + 1)
      <audio id="voz" class="clip" src="assets/voz.wav" data-start="0" data-duration="7" data-track-index="3" data-volume="1"></audio>
      -->

      <!-- PALABRAS CLAVE: 1–3 palabras, una cada 5–8 s, entre y = 300 y 1150 px, nunca encima de una cara.
           data-start = cuando la voz dice la palabra (0,05 s antes). style="top: …px" para colocarla. -->
      <div id="clave-1" class="clip clave" data-start="0.45" data-duration="1.3" data-track-index="2" style="top: 330px">
        <span class="clave-in">Amasa <em>sola</em></span>
      </div>
      <div id="clave-2" class="clip clave" data-start="4.1" data-duration="1.1" data-track-index="2" style="top: 360px">
        <span class="clave-in"><em>¡Pum!</em></span>
      </div>

      <!-- SUBTITULOS:INICIO (los escribe subtitulos.mjs a partir de assets/transcript.json) -->
      <div id="sub-1" class="clip sub" data-start="0.10" data-duration="1.50" data-track-index="1"><span>Este panadero tiene</span></div>
      <div id="sub-2" class="clip sub" data-start="1.60" data-duration="1.40" data-track-index="1"><span>una máquina que amasa sola,</span></div>
      <div id="sub-3" class="clip sub" data-start="3.00" data-duration="1.15" data-track-index="1"><span>y la vecina no se lo cree.</span></div>
      <div id="sub-4" class="clip sub" data-start="4.15" data-duration="0.85" data-track-index="1"><span>Hasta que…</span></div>
      <div id="sub-5" class="clip sub" data-start="5.00" data-duration="2.80" data-track-index="1"><span>trabaja más que antes.</span></div>
      <!-- SUBTITULOS:FIN -->
    </div>

    <script>
      // Línea de tiempo principal: un reloj que dibuja el mundo 3D en cada fotograma + las palabras clave.
      (function () {
        const root = document.getElementById("root");
        const duracion = parseFloat(root.dataset.duration);
        const reloj = { t: 0 };
        const host = { render: null, listo: null };
        window.__escena = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["mundo"] = new Promise((resolve) => { host.listo = resolve; });

        const tl = gsap.timeline({ paused: true });
        tl.to(reloj, { t: duracion, duration: duracion, ease: "none", onUpdate: () => { if (host.render) host.render(reloj.t); } }, 0);
        host.reloj = reloj;

        // Palabras clave: pop de entrada, crecen un pelín mientras están y salen rápido.
        document.querySelectorAll(".clave").forEach((el, i) => {
          const s = parseFloat(el.dataset.start), d = parseFloat(el.dataset.duration);
          const inner = el.querySelector(".clave-in");
          const giro = i % 2 ? 3 : -3;
          tl.fromTo(inner, { scale: 0.35, opacity: 0, rotation: giro * 2.5 }, { scale: 1, opacity: 1, rotation: giro, duration: 0.2, ease: "back.out(2.6)" }, s);
          tl.fromTo(inner, { scale: 1 }, { scale: 1.05, duration: Math.max(0.05, d - 0.34), ease: "none" }, s + 0.2);
          tl.to(inner, { scale: 0.86, opacity: 0, duration: 0.12, ease: "power2.in" }, s + d - 0.13);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import { crearEscena } from "./escena.js";
      const host = window.__escena;
      const mundo = await crearEscena(document.getElementById("mundo"));
      host.render = (t) => mundo.render(t);
      mundo.render(host.reloj.t);
      host.listo();
    </script>
  </body>
</html>
